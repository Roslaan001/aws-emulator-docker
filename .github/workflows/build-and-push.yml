name: Build & Publish Multi-Arch Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly every Monday at 03:00 UTC to automatically track upstream AWS LTS RPM updates
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Log in to Docker Hub (if secrets provided)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Log in to Amazon ECR Public via OIDC Role
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        if: github.event_name != 'pull_request' && env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # Fetch upstream AWS Emulator LTS version
      - name: Fetch upstream AWS Emulator version
        id: upstream
        run: |
          VERSION=$(curl -sSL https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/versions.json | jq -r '.versions[-1].version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch upstream version, falling back to empty"
            VERSION=""
            SEMVER_3=""
            MAJOR_MINOR=""
          else
            echo "Upstream AWS Emulator raw version: ${VERSION}"
            SEMVER_3=$(echo "${VERSION}" | cut -d. -f1,2,3)
            MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
            echo "Standard 3-part SemVer: ${SEMVER_3}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "semver_3=${SEMVER_3}" >> $GITHUB_OUTPUT
          echo "major_minor=${MAJOR_MINOR}" >> $GITHUB_OUTPUT

      # Generate metadata & tags for all configured registries
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_USER != '' && format('docker.io/{0}/aws-emulator', env.DOCKERHUB_USER) || '' }}
            ${{ secrets.PUBLIC_ECR_ALIAS != '' && format('public.ecr.aws/{0}/aws-emulator', secrets.PUBLIC_ECR_ALIAS) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.upstream.outputs.semver_3 }},enable=${{ steps.upstream.outputs.semver_3 != '' && '{{is_default_branch}}' || 'false' }}
            type=raw,value=${{ steps.upstream.outputs.version }},enable=${{ steps.upstream.outputs.version != '' && '{{is_default_branch}}' || 'false' }}
            type=raw,value=${{ steps.upstream.outputs.major_minor }},enable=${{ steps.upstream.outputs.major_minor != '' && '{{is_default_branch}}' || 'false' }}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Build and push multi-arch image
      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cryptographic Build Provenance Attestation
      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
